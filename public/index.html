/* ------------------------------------------------------------------ public-site mode
   Outside Claude, the same features run on our own Cloudflare server:
   rooms (multiplayer) over a WebSocket, AI through /api/ai, normal browser downloads. */
class WebRoom{
  constructor(code){this.code=code;this.s=null;this.l=new Set();this.pending=new Map();this.n=0;this.retry=0;this.open();}
  open(){
    const proto=location.protocol==='https:'?'wss':'ws';
    const ws=this.ws=new WebSocket(`${proto}://${location.host}/api/room/${encodeURIComponent(this.code)}`);
    ws.onopen=()=>{this.retry=0;this.pending.forEach(p=>ws.send(p.msg));clearInterval(this.ping);this.ping=setInterval(()=>{try{ws.send('{"t":"ping"}');}catch(e){}},25000);};
    ws.onmessage=e=>{let m;try{m=JSON.parse(e.data);}catch(x){return;}
      if(m.t==='state'){this.s=m.s;this.l.forEach(f=>{try{f(this.s);}catch(x){console.warn(x);}});}
      else if(m.t==='ack'){const p=this.pending.get(m.id);if(p){this.pending.delete(m.id);clearTimeout(p.to);m.ok?p.res():p.rej(Object.assign(new Error(m.error||'error'),{code:m.error==='limit'?'rate_limited':m.error}));}}};
    ws.onclose=()=>{clearInterval(this.ping);if(this.closed)return;const d=Math.min(8000,400*Math.pow(2,this.retry++));setTimeout(()=>{if(!this.closed)this.open();},d);};
  }
  op(op,path,data){const id=++this.n;const msg=JSON.stringify({t:'op',id,op,path,data});
    return new Promise((res,rej)=>{const to=setTimeout(()=>{if(this.pending.has(id)){this.pending.delete(id);rej(Object.assign(new Error('timeout'),{code:'timeout'}));}},20000);
      this.pending.set(id,{msg,res,rej,to});if(this.ws.readyState===1)this.ws.send(msg);});}
  sub(f){this.l.add(f);if(this.s)f(this.s);return()=>this.l.delete(f);}
}
class WebDb{
  constructor(){this.rooms={};}
  room(code){return this.rooms[code]||(this.rooms[code]=new WebRoom(code));}
  parse(path){const p=String(path).split('/');return {code:p[1],coll:p[2]||'game',id:p[3],rest:p.slice(2).join('/')||'game'};}
  doc(path){const {code,coll,id,rest}=this.parse(path);const self=this;return {
    get:async()=>{const r=await fetch('/api/room/'+encodeURIComponent(code)+'/peek',{cache:'no-store'});const j=await r.json();return {exists:!!j.exists,data:()=>j.game};},
    set:d=>self.room(code).op('set',rest,d),
    update:d=>self.room(code).op('update',rest,d),
    delete:()=>self.room(code).op('delete',rest),
    onSnapshot:cb=>self.room(code).sub(s=>{const v=rest==='game'?s.game:(s[coll]||{})[id];cb({exists:v!=null,data:()=>v});})
  };}
  collection(path){const {code,coll}=this.parse(path);const self=this;const snap=s=>{const docs=Object.entries((s&&s[coll])||{}).map(([id,v])=>({id,data:()=>v}));return {docs,size:docs.length};};return {
    get:()=>new Promise(res=>{const un=self.room(code).sub(s=>{setTimeout(()=>un(),0);res(snap(s));});}),
    onSnapshot:cb=>self.room(code).sub(s=>cb(snap(s)))
  };}
}
async function webSample(prompt,opts){
  const r=await fetch('/api/ai',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({prompt,tier:opts&&opts.modelTier,room:S.game&&S.game.code})});
  if(r.status===429){throw Object.assign(new Error('limit'),{code:'limit'});}
  if(!r.ok)throw Object.assign(new Error('ai'),{code:'ai'});
  return await r.json();
}
async function initWeb(){
  if(!/^https?:$/.test(location.protocol))return;
  S.web=true;S.caps.canWrite=true;
  S.caps.user={id:async()=>null,can:async()=>true};
  S.caps.downloads={save({filename,data}){const blob=new Blob([data],{type:/\.pdf$/i.test(filename)?'application/pdf':'application/octet-stream'});const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);}};
  try{const r=await fetch('/api/config',{cache:'no-store'});if(r.ok){S.caps.db=new WebDb();const c=await r.json();if(c.ai)S.caps.sample=webSample;}}catch(e){console.warn(e);}
  render();
}
(async function(){
  if(!window.claude||typeof window.claude.use!=='function'){initWeb();return;}
  try{
    const [db,user,sample,downloads]=await Promise.all([claude.use('db').catch(()=>null),claude.use('user').catch(()=>null),claude.use('sample').catch(()=>null),claude.use('downloads').catch(()=>null)]);
    S.caps.db=db;S.caps.user=user;S.caps.sample=sample;S.caps.downloads=downloads;
    if(user&&typeof user.can==='function'){try{S.caps.canWrite=await user.can('data.write');}catch(e){}}
    if(S.view!=='game')render();else render();
  }catch(e){console.warn(e);}
})();
