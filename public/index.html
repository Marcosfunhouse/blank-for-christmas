  --pine:#163b2e; --pine2:#1f5240; --cran:#a3162f; --cran2:#c42a43; --gold:#d4ab55; --gold2:#f0d595;
  --cream:#fbf5ea; --paper:#fffdf8; --ink:#2a1a15; --muted:#7a6a5f; --line:#e8dcc7; --ok:#2f7a4f;
  --r:16px; --shadow:0 10px 30px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:'Hanken Grotesk','DM Sans',system-ui,sans-serif;color:var(--ink);background:radial-gradient(ellipse at top,#245a45 0%,var(--pine) 45%,#0e2a20 100%) fixed;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
#snow{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.flake{position:absolute;top:-10px;color:#fff;opacity:.7;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(105vh) translateX(30px)}}
@media (prefers-reduced-motion:reduce){.flake{display:none}}
#app{position:relative;z-index:1;max-width:620px;margin:0 auto;padding:16px 16px 120px}
body.tv #app{max-width:1400px}
h1,h2,h3{font-weight:400;font-family:'Cortesia',cursive;margin:0;line-height:1.1}
.hero{text-align:center;color:var(--cream);padding:36px 0 8px}
.hero .kicker{font-weight:400;font-family:'Redbell','Cortesia',cursive;font-size:44px;color:var(--gold2);line-height:1}
.hero h1{font-size:46px;font-weight:800;letter-spacing:-.5px}
.hero .sub{font-weight:400;font-family:'Cortesia',cursive;font-size:20px;color:var(--gold2);margin-top:4px}
.hero .rule{width:120px;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:16px auto}
.lede{color:#e9e0cf;text-align:center;font-size:17px;max-width:460px;margin:8px auto 24px}
.fine{color:#b9c9bd;font-size:13px;text-align:center}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.btn{appearance:none;border:1.5px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);color:var(--cream);padding:14px 18px;border-radius:999px;font-weight:700;cursor:pointer;font-size:16px;transition:transform .1s,background .2s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:linear-gradient(180deg,var(--cran2),var(--cran));border-color:#7d0f22;color:#fff;box-shadow:0 6px 18px rgba(163,22,47,.45)}
.btn.gold{background:linear-gradient(180deg,var(--gold2),var(--gold));border-color:#a8832e;color:#3a2a0a}
.btn.small{padding:8px 14px;font-size:14px}
.btn.ghost{background:transparent}
.paper .btn,.sheet .btn{color:var(--ink);border-color:var(--line);background:#fff}
.paper .btn.primary,.sheet .btn.primary{color:#fff;background:linear-gradient(180deg,var(--cran2),var(--cran));border-color:#7d0f22}
.paper .btn.gold,.sheet .btn.gold{background:linear-gradient(180deg,var(--gold2),var(--gold));border-color:#a8832e;color:#3a2a0a}
.link{background:none;border:none;color:var(--gold2);text-decoration:underline;cursor:pointer;padding:4px}
.paper .link,.sheet .link{color:var(--cran)}
.paper{background:var(--paper);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);margin:14px 0;position:relative}
.paper.cream{background:var(--cream)}
.paper h2{font-size:26px;margin-bottom:6px}
.paper h3{font-size:19px;margin:0 0 6px}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--cran)}
.on-dark .eyebrow,.topbar .eyebrow{color:var(--gold2)}
.choice{display:block;width:100%;text-align:left;border:2px solid var(--line);background:#fff;border-radius:14px;padding:16px;cursor:pointer;margin-bottom:12px;transition:border-color .15s,transform .1s}
.choice:hover{border-color:var(--gold)}
.choice:active{transform:scale(.99)}
.choice.sel{border-color:var(--cran);background:#fff6f4}
.choice b{font-weight:400;font-family:'Cortesia',cursive;font-size:20px;display:block;margin-bottom:4px}
.choice:disabled{opacity:.5;cursor:not-allowed}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:#f3ead9;color:#6b5133;margin:2px 4px 2px 0}
.tag.red{background:#fde4e7;color:var(--cran)}
.tag.green{background:#e0f0e6;color:var(--ok)}
label.f{display:block;font-weight:700;font-size:14px;margin:14px 0 6px}
input.t,textarea.t,select.t{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;font-size:16px}
textarea.t{min-height:90px;resize:vertical}
input.t:focus,textarea.t:focus,select.t:focus{outline:none;border-color:var(--gold)}
details.sec{border:1.5px solid var(--line);border-radius:12px;margin:10px 0;background:#fff}

details.sec>summary::after{content:'＋';margin-left:auto;color:var(--muted)}
details.sec[open]>summary::after{content:'－'}
details.sec .body{padding:0 16px 16px}
.item{border:1px dashed var(--line);border-radius:10px;padding:10px 12px;margin:10px 0;background:var(--cream)}
.item .row input{flex:1}
.sugbtn{display:inline-flex;align-items:center;gap:4px;margin-left:8px;padding:3px 10px;border-radius:999px;border:1.5px solid var(--gold);background:#fff8e6;color:#6b4e14;font-size:12px;font-weight:700;cursor:pointer;vertical-align:middle}
.sugbtn:hover{background:#ffefc4}
.sugbtn:disabled{opacity:.6}
.checks label{display:flex;gap:8px;align-items:center;padding:6px 0;font-weight:500}
.topbar{display:flex;align-items:center;gap:8px;color:var(--cream);padding:4px 0 10px}
.topbar .ttl{font-weight:400;font-family:'Cortesia',cursive;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1 1 auto}
.code-pill{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:4px 10px;font-weight:700;letter-spacing:.15em;font-size:13px}
.steps{display:flex;gap:4px;margin:2px 0 6px}
.steps i{flex:1;height:4px;border-radius:4px;background:rgba(255,255,255,.18)}
.steps i.on{background:var(--gold)}
.steps i.now{background:var(--gold2);box-shadow:0 0 8px var(--gold2)}
.round-head{color:var(--cream);text-align:center;padding:10px 0 4px}
.round-head .eyebrow{color:var(--gold2)}
.round-head h2{font-size:32px;margin:6px 0}
.round-head p{color:#e3dacb;max-width:520px;margin:6px auto 0}
.cue{background:rgba(212,171,85,.15);border:1px solid rgba(212,171,85,.5);color:var(--gold2);border-radius:12px;padding:10px 14px;margin:12px 0;font-style:italic}
.mech{display:flex;gap:12px;align-items:flex-start}
.mech .ico{font-size:30px;line-height:1}
.plist{list-style:none;margin:0;padding:0}
.plist li{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.plist li:last-child{border-bottom:none}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.pname{font-weight:700}
.pres{font-size:14px;color:var(--muted)}
.done-badge{color:var(--ok);font-weight:700;font-size:13px}
.grid{display:grid;gap:10px;margin-top:12px}
.g-num{grid-template-columns:repeat(auto-fill,minmax(64px,1fr))}
.numtile{font-weight:400;aspect-ratio:1;border-radius:14px;border:2px solid var(--line);background:#fff;font-family:'Cortesia',cursive;font-size:26px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px}
.numtile small{font-family:'Hanken Grotesk';font-size:10.5px;font-weight:500;color:var(--muted);line-height:1.1;text-align:center}

.g-cards{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}
.pcard{position:relative;aspect-ratio:5/7;border-radius:12px;border:1.5px solid #d8cdb9;background:#fff;cursor:pointer;padding:8px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 3px 8px rgba(0,0,0,.08);text-align:left}
.pcard .rk{font-weight:400;font-family:'Cortesia',cursive;font-size:22px;line-height:1}
.pcard .lb{font-size:12px;line-height:1.2;font-weight:500}
.pcard.red .rk{color:var(--cran)}
.pcard.taken,.house.taken,.cup.taken,.numtile.taken{opacity:.38;cursor:not-allowed;filter:grayscale(.7)}
.owner{font-size:11px;font-weight:700;color:var(--cran)}
.g-houses{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
.house{border:none;background:none;cursor:pointer;padding:0;text-align:center}
.house svg{width:100%;height:auto;display:block;filter:drop-shadow(0 4px 6px rgba(0,0,0,.18))}
.house .hn{font-size:13px;font-weight:700;margin-top:4px;line-height:1.2}
.cups{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:14px}
.cups .crow{display:flex;gap:6px;justify-content:center}
.cup{border:none;background:none;cursor:pointer;padding:0;width:64px;text-align:center}
.cup svg{width:100%;display:block}
.cup.taken svg{transform:rotate(-80deg) translateY(10px)}
.gift{font-weight:400;aspect-ratio:1;border:none;border-radius:12px;cursor:pointer;color:#fff;font-family:'Cortesia',cursive;font-size:28px;position:relative;background:linear-gradient(90deg,transparent 44%,var(--gold) 44% 56%,transparent 56%),linear-gradient(0deg,transparent 44%,var(--gold) 44% 56%,transparent 56%),var(--cran)}
.gift:nth-child(3n+2){background-color:var(--pine2)}
.gift:nth-child(3n){background-color:#6d3a8a}
.gift span{position:relative;background:rgba(0,0,0,.35);border-radius:8px;padding:0 8px}
.rollzone{text-align:center;padding:10px 0}
.bigdie{font-weight:400;display:inline-flex;width:96px;height:96px;border-radius:20px;background:#fff;border:2px solid var(--line);align-items:center;justify-content:center;font-family:'Cortesia',cursive;font-size:44px;margin:8px;box-shadow:0 6px 14px rgba(0,0,0,.12)}
.bigdie.spin{animation:wob .12s linear infinite}
@keyframes wob{0%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}100%{transform:rotate(-8deg)}}
.marquee{font-weight:400;font-family:'Cortesia',cursive;font-size:26px;min-height:70px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;border:2px dashed var(--gold);border-radius:14px;margin:12px 0;background:#fffaf0}
#modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(10,25,18,.72);padding:16px;backdrop-filter:blur(3px)}
#modal.show{display:flex}
#modal .sheet{background:var(--paper);border-radius:20px;max-width:520px;width:100%;max-height:90vh;overflow:auto;padding:24px;box-shadow:var(--shadow);animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.reveal-title{font-weight:400;font-family:'Cortesia',cursive;font-size:30px;margin:6px 0 10px}
.reveal-place{font-weight:400;font-family:'Redbell','Cortesia',cursive;font-size:32px;color:var(--cran)}
.quote{font-weight:400;font-family:'Cortesia',cursive;font-size:19px;border-left:3px solid var(--gold);padding-left:12px;margin:12px 0}
.kv{margin:8px 0}.kv b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--cran)}
.mcards{display:grid;gap:14px;grid-template-columns:1fr}
body.tv .mcards{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.mcard{background:var(--paper);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);border-top:6px solid var(--pc,var(--cran))}
.mcard .top{padding:14px 16px 8px;background:linear-gradient(180deg,#fff,var(--cream))}
.mcard .nm{font-weight:400;font-family:'Cortesia',cursive;font-size:24px;line-height:1.1}
.mcard .who{font-size:13px;color:var(--muted)}
.mcard dl{margin:0;padding:6px 16px 14px}
.mcard dt{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--cran);font-weight:700;margin-top:10px}
.mcard dd{margin:2px 0 0;font-size:15px}
.mcard .tw{font-size:14px;margin:4px 0}
.mcard .tw i{color:var(--muted);font-size:12px;display:block;font-style:normal}
.unk{color:#b8a998;font-style:italic}
.timer{font-weight:400;font-family:'Cortesia',cursive;font-size:72px;text-align:center;color:var(--cream);letter-spacing:1px;line-height:1;margin:10px 0}
body.tv .timer{font-size:150px}
.timer.low{color:#ff8b8b}
.timer.up{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.4}}
.code-big{font-weight:400;font-family:'Cortesia',cursive;font-size:64px;letter-spacing:.2em;text-align:center;color:var(--cran)}
.poster{position:relative;aspect-ratio:2/3;border-radius:10px;overflow:hidden;color:#fff;background:linear-gradient(180deg,#0f2d48 0%,#3b2a5c 45%,var(--pc,#a3162f) 100%);display:flex;flex-direction:column;text-align:center;padding:22px 18px;box-shadow:0 14px 34px rgba(0,0,0,.4)}
.poster .net{font-size:10px;letter-spacing:.3em;text-transform:uppercase;opacity:.85}
.poster .crit{font-weight:400;font-family:'Cortesia',cursive;font-size:14px;margin-top:10px;opacity:.95}
.poster .crit small{display:block;font-style:normal;font-size:10px;letter-spacing:.15em;text-transform:uppercase;opacity:.75;margin-top:2px}
.poster .star{font-size:12px;letter-spacing:.18em;text-transform:uppercase;margin-top:auto}
.poster .ptitle{font-weight:400;font-family:'Cortesia',cursive;font-size:34px;line-height:1.02;margin:8px 0;text-shadow:0 3px 12px rgba(0,0,0,.5)}
.poster .tagl{font-weight:400;font-family:'Redbell','Cortesia',cursive;font-size:24px;color:var(--gold2);line-height:1.1}
.poster .bill{font-size:9px;line-height:1.35;letter-spacing:.06em;text-transform:uppercase;opacity:.75;margin-top:10px}
.poster .prem{font-weight:700;letter-spacing:.2em;font-size:11px;margin-top:6px;color:var(--gold2)}
.poster svg.vil{position:absolute;left:0;right:0;bottom:0;width:100%;opacity:.55;pointer-events:none}
.poster .cont{position:relative;display:flex;flex-direction:column;height:100%}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:999px;z-index:60;font-weight:500;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1}
.footer-bar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:linear-gradient(0deg,rgba(9,28,20,.98),rgba(9,28,20,.85));border-top:1px solid rgba(255,255,255,.12);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.footer-bar .in{max-width:620px;margin:0 auto;display:flex;gap:10px;align-items:center;color:var(--cream)}
body.tv .footer-bar .in{max-width:1400px}
.spin-ld{display:inline-block;width:18px;height:18px;border:2.5px solid rgba(0,0,0,.15);border-top-color:var(--cran);border-radius:50%;animation:rot 0.8s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes rot{to{transform:rotate(360deg)}}
.winner{text-align:center;color:var(--cream)}
.winner .crown{font-size:56px}
.winner h2{font-size:38px}
.tally{display:flex;align-items:center;gap:10px;padding:8px 0}
.tally .bar{height:10px;border-radius:6px;background:var(--gold)}
.on-dark{color:var(--cream)}
.center{text-align:center}
.hide{display:none!important}
.confetti{position:fixed;top:-12px;width:9px;height:14px;z-index:70;animation:conf 2.6s ease-in forwards;pointer-events:none}
@keyframes conf{to{transform:translateY(105vh) rotate(720deg);opacity:.8}}
.tvgrid h1{color:var(--cream);font-size:48px;text-align:center}


/* ---------- gift wrap theme ---------- */
html,body{overflow-x:hidden}
body{background-color:#a3162f;background-attachment:fixed;transition:background-color .4s}
body[data-wrap="dots"]{background-color:#a3162f;background-image:radial-gradient(circle,#f0d595 0 5px,transparent 6px),radial-gradient(circle,rgba(255,255,255,.9) 0 2.5px,transparent 3.5px);background-size:56px 56px,56px 56px;background-position:0 0,28px 28px}
body[data-wrap="plaid"]{background-color:#1f5240;background-image:repeating-linear-gradient(0deg,rgba(196,42,67,.55) 0 14px,transparent 14px 64px),repeating-linear-gradient(90deg,rgba(196,42,67,.55) 0 14px,transparent 14px 64px),repeating-linear-gradient(0deg,transparent 0 24px,rgba(255,255,255,.5) 24px 26px,transparent 26px 64px),repeating-linear-gradient(90deg,transparent 0 24px,rgba(255,255,255,.5) 24px 26px,transparent 26px 64px)}
body[data-wrap="candy"]{background-color:#fff;background-image:repeating-linear-gradient(-45deg,#c42a43 0 26px,#fff 26px 40px,#1f6b4f 40px 46px,#fff 46px 60px)}
body[data-wrap="gold"]{background-color:#c9a24b;background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.35) 0 3px,transparent 3px 22px),repeating-linear-gradient(90deg,transparent 0 10px,rgba(120,80,20,.18) 10px 12px,transparent 12px 22px),radial-gradient(circle at 30% 20%,rgba(255,255,255,.35),transparent 50%)}
body[data-wrap="stars"]{background-color:#1b2a52;background-image:radial-gradient(circle,#f0d595 0 2.2px,transparent 3px),radial-gradient(circle,#fff 0 1.4px,transparent 2px),radial-gradient(circle,#f0d595 0 1.2px,transparent 2px);background-size:90px 90px,60px 60px,130px 130px;background-position:0 0,30px 40px,70px 15px}
body[data-wrap="kraft"]{background-color:#b98c5e;background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.06) 0 2px,transparent 2px 6px),repeating-linear-gradient(-45deg,rgba(0,0,0,.05) 0 2px,transparent 2px 7px),linear-gradient(90deg,transparent 0 calc(50% - 7px),#c42a43 calc(50% - 7px) calc(50% - 2px),#fff calc(50% - 2px) calc(50% + 2px),#c42a43 calc(50% + 2px) calc(50% + 7px),transparent calc(50% + 7px))}
/* falling bows */
.bowf{color:transparent;top:-80px;filter:drop-shadow(0 3px 3px rgba(0,0,0,.22))}
.bowf svg{display:block;width:100%;height:100%;animation:twirl linear infinite}
@keyframes twirl{to{transform:rotate(360deg)}}
@keyframes sway{from{transform:rotate(-22deg)}to{transform:rotate(22deg)}}
/* cards = wrapped boxes with a ribbon + bow */
.paper{border-radius:10px;margin:30px 0 16px;box-shadow:0 12px 28px rgba(0,0,0,.3)}
.paper::before{content:'';position:absolute;left:0;right:0;top:0;height:12px;border-radius:10px 10px 0 0;background:linear-gradient(180deg,#f0d595,#d4ab55 60%,#b08a3a)}
.paper::after{content:'';position:absolute;top:-30px;left:50%;width:58px;height:58px;transform:translateX(-50%);background:var(--goldbow) center/contain no-repeat;filter:drop-shadow(0 3px 3px rgba(0,0,0,.25))}
.paper{padding-top:30px}
#modal .sheet{border-top:12px solid #d4ab55}
/* gift tags for text that sits on the wrapping paper */
.round-head,.winner,.hero .bigtag,.tvgrid h1{position:relative;background:#fffdf8;color:var(--ink);border-radius:14px 14px 14px 14px;padding:22px 22px 20px 52px;margin:18px 6px 8px;box-shadow:0 10px 24px rgba(0,0,0,.3);transform:rotate(-1.2deg);text-shadow:none}
.round-head::before,.winner::before,.hero .bigtag::before,.tvgrid h1::before{content:'';position:absolute;left:18px;top:50%;width:16px;height:16px;margin-top:-8px;border-radius:50%;background:var(--paper);box-shadow:inset 0 0 0 4px #d4ab55,0 0 0 2px rgba(0,0,0,.06)}
.round-head::after,.winner::after,.hero .bigtag::after,.tvgrid h1::after{content:'';position:absolute;left:-40px;top:50%;width:62px;height:3px;background:#d4ab55;transform:rotate(-12deg);transform-origin:right}
.round-head .eyebrow{color:var(--cran)}
.round-head h2{color:var(--cran)}
.round-head p{color:#5a4a40}
.winner{color:var(--ink)}
.winner h2{color:var(--cran)}
.winner .eyebrow{color:var(--cran)!important}
.winner p{color:var(--muted)!important}
.tvgrid h1{color:var(--cran);display:block;width:fit-content;margin:18px auto;padding-left:56px}
/* home hero tag */
.hero{padding:22px 0 4px;color:var(--ink)}
.hero .bigtag{padding:26px 22px 24px 58px;transform:rotate(-2deg)}
.hero .tagto{font-weight:400;font-family:'Redbell','Cortesia',cursive;font-size:24px;color:var(--muted);margin-bottom:4px}
.hero h1.bfc{display:flex;flex-direction:column;align-items:center;gap:2px}
.hero .blank{display:inline-block;min-width:6em;max-width:100%;border-bottom:4px solid var(--cran);padding:0 6px 2px;line-height:1.05;min-height:1.15em}
.hero .bw{font-weight:400;font-family:'Redbell','Cortesia',cursive;font-size:62px;color:var(--cran);display:inline-block;transition:opacity .3s,transform .3s}
.hero .bw.out{opacity:0;transform:translateY(-10px) rotate(-3deg)}
.hero .for{font-weight:400;font-family:'Cortesia',cursive;font-size:46px;color:var(--ink);letter-spacing:-.5px;margin-top:6px}
.hero .sub{color:var(--muted)}
.lede,.fine{background:rgba(255,253,248,.94);color:var(--ink);border-radius:12px;padding:14px 16px;box-shadow:0 8px 20px rgba(0,0,0,.2);text-shadow:none}
.fine{font-size:12.5px;max-width:460px;margin:18px auto 0}
/* bits that sit directly on the paper */
.topbar{background:rgba(20,12,10,.55);border-radius:999px;padding:6px 6px 6px 16px;margin-bottom:8px}
.topbar .ttl{font-weight:400;font-family:'Cortesia',cursive;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1 1 auto}
.steps{background:rgba(20,12,10,.4);padding:4px;border-radius:999px}
.timer{background:#fffdf8;color:var(--cran);display:block;width:fit-content;margin:14px auto;padding:10px 26px;border-radius:16px;box-shadow:0 10px 24px rgba(0,0,0,.3);border-top:10px solid #d4ab55}
.timer.low{color:#d0213b}
.cue{background:#fffdf8;color:var(--cran);border:2px dashed #d4ab55}
.on-dark .link,.on-dark>.link{background:rgba(20,12,10,.55);border-radius:999px;padding:6px 12px;color:#fff;text-decoration:none}
.btn.ghost{background:rgba(20,12,10,.5)}
.footer-bar{border-top:4px solid #d4ab55}
.stack>.btn.primary{background:linear-gradient(180deg,#f0d595,#d4ab55);color:#3a2a0a;border:2px solid #fff;box-shadow:0 8px 20px rgba(0,0,0,.3)}
.stack>.btn:not(.primary){background:rgba(20,12,10,.6);border-color:rgba(255,255,255,.5)}
.tctl .btn:not(.gold):not(.primary){background:rgba(20,12,10,.65);border-color:rgba(255,255,255,.45);color:#fff}
.hero .tagto{font-size:19px;white-space:nowrap}
@media (max-width:480px){.hero .for{font-size:36px}.hero .bw{font-size:52px}.hero .bigtag{padding:22px 16px 20px 46px}.round-head,.winner{padding-left:44px}.round-head::before,.winner::before{left:14px}}

#modal .sheet.wide{max-width:640px}
.htabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin:0 -4px 6px;scrollbar-width:none}

.htab{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font-weight:700;font-size:13px;cursor:pointer;color:var(--ink)}
.htab.on{background:var(--cran);border-color:var(--cran);color:#fff}
.hbody h4{font-weight:400;font-family:'Cortesia',cursive;font-size:17px;margin:16px 0 6px}
.hlead{font-weight:400;font-family:'Cortesia',cursive;font-size:17px;line-height:1.4;margin:6px 0 12px}

.htable{width:100%;border-collapse:collapse;font-size:13.5px}.htable th{text-align:left;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--cran);padding:6px 6px;border-bottom:2px solid var(--line)}
.htable td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}.htable td:first-child{font-weight:800;white-space:nowrap}.htable td:last-child{white-space:nowrap;color:var(--muted)}

.faq{display:grid;gap:4px 0;font-size:14px}.faq b{margin-top:8px;color:var(--cran)}

.pitchblock{padding:12px 16px 4px;border-bottom:1px dashed var(--line);background:#fff}
.pb-title{font-weight:400;font-family:'Cortesia',cursive;font-size:22px;color:var(--cran);line-height:1.15}
.pb-tag{font-weight:400;font-family:'Cortesia',cursive;font-size:15px;margin:4px 0 6px;color:var(--ink)}
.pb-plot{font-size:14px;color:#3b2a24}.pb-plot p{margin:6px 0}
.pitchblock.big .pb-title{font-size:30px}.pitchblock.big .pb-tag{font-size:18px}.pitchblock.big .pb-plot{font-size:16px}
body.tv .pitchblock.big .pb-title{font-size:44px}body.tv .pitchblock.big .pb-plot{font-size:20px}
.pitchsheet .ptitle-in{font-weight:400;font-family:'Cortesia',cursive;font-size:20px}

.qp-note{text-align:center;font-size:12.5px;color:#fff;margin:-6px 0 2px;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.beats{margin:8px 0 0;padding-left:22px}.beats li{margin:8px 0}.beats li b{font-weight:400;font-family:'Cortesia',cursive;font-size:16px;margin-right:6px}

.smeter{display:flex;align-items:center;gap:10px;margin:2px 0 6px}.smeter .bar{flex:1;height:8px;border-radius:6px;background:#eee3d0;overflow:hidden}.smeter .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--cran));border-radius:6px}.smeter span{font-size:13px;color:var(--muted);white-space:nowrap}
.sg-h{font-weight:400;font-family:'Cortesia',cursive;font-size:18px;margin:18px 0 8px}.sg-h span{font-family:'Hanken Grotesk';font-weight:500;font-size:12px;color:var(--muted);margin-left:6px}
.sgrid{display:grid;gap:10px}.sgrid.one{grid-template-columns:1fr}.sgrid.three{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.sgrid.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.stile{min-width:0}
.sgrid.two .st-badge{display:none}
.slegend{font-size:12px;color:var(--muted);margin:2px 0 0}.slegend i{display:inline-block;width:11px;height:11px;border-radius:3px;border:2px solid var(--cran);background:#fff8f6;vertical-align:-1px;margin-right:4px}.st-val,.st-meta{overflow-wrap:anywhere}
@media (max-width:420px){.sgrid.three{grid-template-columns:1fr}}
.stile{display:flex;flex-direction:column;gap:3px;text-align:left;border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px 11px;cursor:pointer;min-height:92px;transition:border-color .15s,transform .1s;color:var(--ink)}
.stile:hover{border-color:var(--gold)}.stile:active{transform:scale(.98)}
.stile.changed{border-color:var(--cran);background:#fff8f6}
.st-top{display:flex;align-items:center;gap:6px}
.st-n{flex:none;width:20px;height:20px;border-radius:50%;background:var(--ink);color:#fff;font-size:11px;font-weight:800;display:inline-flex;align-items:center;justify-content:center}
.stile.changed .st-n{background:var(--cran)}
.st-lab{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;color:var(--muted);flex:1;line-height:1.15}
.st-badge{font-size:10px;font-weight:800;padding:2px 7px;border-radius:999px;background:var(--cran);color:#fff;flex:none}.st-badge.def{background:#efe6d6;color:#8a7a68}
.st-val{font-weight:400;font-family:'Cortesia',cursive;font-size:15px;line-height:1.2}
.st-meta{font-size:12px;color:var(--muted);line-height:1.25}
.sround{border:1.5px dashed var(--line);border-radius:14px;padding:10px;margin:10px 0;background:var(--cream)}
.sr-title{font-weight:400;font-family:'Cortesia',cursive;font-size:16px;margin:0 0 8px 2px}.sr-ch{font-family:'Hanken Grotesk';font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--cran);font-weight:800;margin-right:8px}
.pmodes{display:grid;gap:8px;grid-template-columns:repeat(3,1fr);margin-bottom:10px}.pmodes .choice{margin:0;padding:10px}.pmodes .choice b{font-size:15px}
@media (max-width:480px){.pmodes{grid-template-columns:1fr}}
.pprev{margin:6px 0 8px;padding-left:18px;font-size:13.5px}.pprev li{margin:2px 0}

.credit{margin:34px auto 0;max-width:360px;background:#fffdf8;border-radius:16px;padding:18px 18px 14px;text-align:center;box-shadow:0 10px 24px rgba(0,0,0,.3);transform:rotate(1.2deg);position:relative}
.credit::before{content:'';position:absolute;left:50%;top:-12px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:#fffdf8;box-shadow:inset 0 0 0 4px #d4ab55}
.credit-text{font-weight:400;font-family:'Redbell','Cortesia',cursive;font-size:27px;text-wrap:balance;line-height:1.15;color:var(--cran)}
.credit-logo{display:block;width:100%;max-width:280px;height:auto;margin:8px auto 0}

.twistq{margin:8px 0 0;padding-left:22px}.twistq li{font-weight:400;font-family:'Cortesia',cursive;font-size:19px;margin:8px 0;line-height:1.25}
body.tv .twistq li{font-size:30px}

/* ---------- home: clapperboard over the snowy tree ---------- */
body[data-wrap="photo"]{background:linear-gradient(180deg,rgba(0,0,0,.18) 0%,rgba(0,0,0,0) 22%,rgba(0,0,0,0) 55%,rgba(0,0,0,.6) 100%),var(--treephoto) center 30%/cover no-repeat;background-color:#1c2b22;background-attachment:scroll;min-height:100vh}

body[data-wrap="photo"] #snow{display:none}
#flakes{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0;display:none}
body[data-wrap="photo"] #flakes{display:block}
.sflake{position:absolute;top:-90px;animation:fall linear infinite;filter:drop-shadow(0 3px 4px rgba(0,0,0,.3))}
.sflake svg{display:block;width:100%;height:100%;animation:twirl linear infinite}
@media (prefers-reduced-motion:reduce){#flakes{display:none!important}}
.home{max-width:430px;margin:0 auto;padding-top:4px;text-align:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.slate{display:block;width:100%;height:auto;margin:-6px 0 6px;filter:drop-shadow(0 12px 18px rgba(0,0,0,.38))}
.slate .g{font-family:'Hanken Grotesk',system-ui,sans-serif;fill:#1d1d1f}
.slate .c{font-weight:400;font-family:'Redbell','Cortesia',cursive;fill:#1d1d1f}
#blankWord{transition:opacity .3s}
#blankWord.out{opacity:0}
.hbtns{display:flex;flex-direction:column;gap:14px;margin:6px 18px 0}
.hbtn{font-weight:400;font-family:'Cortesia',cursive;color:#1d1d1f;border:2.5px solid;border-radius:16px;padding:12px 14px 13px;cursor:pointer;line-height:1.08;box-shadow:0 6px 16px rgba(0,0,0,.25);transition:transform .15s,box-shadow .15s;width:100%}
.hbtn:hover{transform:translateY(-2px) rotate(-.6deg);box-shadow:0 10px 22px rgba(0,0,0,.3)}
.hbtn:active{transform:translateY(1px)}
.hbtn:focus-visible{outline:3px solid #fff;outline-offset:3px}
.hbtn b{display:block;font-weight:400;font-size:34px}
.hbtn span{display:block;font-size:21px;margin-top:4px}
.hbtn[disabled]{opacity:.7;cursor:wait}
.hb-pink{background:#f2c6cf;border-color:#d8433f}
.hb-green{background:#d9ecd0;border-color:#2e9a4f}
.hb-yellow{background:#fdf5db;border-color:#e6c047}
.hb-blue{background:#dcebf8;border-color:#2b6f9e}
.hlinks{margin:14px 0 0;display:flex;gap:8px 18px;justify-content:center;flex-wrap:wrap}
.hlinks button{background:none;border:0;color:#fff;font:500 15px 'Hanken Grotesk','DM Sans',system-ui,sans-serif;text-decoration:underline;text-underline-offset:3px;cursor:pointer;text-shadow:0 1px 6px rgba(0,0,0,.7);padding:4px}
.hcredit{margin:54px 0 0;color:#fff}
.hcredit div{font-weight:400;font-family:'Cortesia',cursive;font-size:22px;text-shadow:0 1px 8px rgba(0,0,0,.6)}
.hcredit img{display:block;width:62%;max-width:260px;height:auto;margin:10px auto 0;filter:drop-shadow(0 2px 6px rgba(0,0,0,.35))}
@media (max-width:380px){.hbtn b{font-size:30px}.hbtn span{font-size:19px}.hbtns{margin:6px 8px 0}}

/* =========== SLATE THEME: the clapperboard look, everywhere =========== */
:root{--ink:#1d1d1f;--muted:#66696e;--line:#d6d8db;--paper:#f6f6f4;--cream:#ebeced;--cran:#c8322b;--cran2:#d8433f;--gold:#e6c047;--gold2:#f6e7ad;--ok:#2e9a4f;--pine:#1d2b23;
 --stripe:repeating-linear-gradient(-55deg,#d8392f 0 18px,#1f8a4c 18px 36px);--clap:#2a2a2c}
body{font-family:'Hanken Grotesk','DM Sans',system-ui,sans-serif;color:var(--ink)}
b,strong{font-weight:600}
h1,h2,h3{font-family:'Cortesia',cursive;font-weight:400}
.ic{width:1.15em;height:1.15em;vertical-align:-.2em;display:inline-block;flex:none}
.ic.inl{margin-right:.4em}
/* backdrops */
body[data-wrap="scene"]{background:#1d2b23}
body[data-wrap="scene"]::before{content:'';position:fixed;inset:0;z-index:0;background:linear-gradient(180deg,rgba(12,18,14,.42),rgba(12,18,14,.6)),var(--treephoto) var(--bgpos,center 30%)/cover no-repeat}
body[data-scene="setup"],body[data-scene="version"],body[data-scene="editor"],body[data-scene="ai"]{--bgpos:85% 20%}
body[data-scene="lobby"],body[data-scene="intro"]{--bgpos:10% 15%}
body[data-scene="name"],body[data-scene="career"]{--bgpos:30% 60%}
body[data-scene="motive"],body[data-scene="hunk"]{--bgpos:70% 80%}
body[data-scene="twist"],body[data-scene="prep"]{--bgpos:20% 90%}
body[data-scene="pitch"],body[data-scene="vote"],body[data-scene="results"]{--bgpos:5% 40%}
#snow{display:none!important}
#flakes{display:block}
/* cards = slates with a clapper stick on top */
.paper{background:var(--paper);border-radius:18px;margin:34px 0 16px;padding:22px 20px 20px;box-shadow:0 14px 30px rgba(0,0,0,.35);border:1.5px solid #cfd1d4}
.paper.cream{background:var(--paper)}
.paper::before{content:'';position:absolute;left:-1.5px;right:-1.5px;top:-22px;height:24px;border-radius:7px 7px 0 0;background:radial-gradient(circle at 17px 12px,#9a9a9e 0 4.5px,transparent 5.5px),linear-gradient(90deg,var(--clap) 0 36px,transparent 36px),var(--stripe);box-shadow:inset 0 0 0 4px var(--clap)}
.paper::after{display:none}
#modal .sheet{background:var(--paper);border-top:none;border-radius:18px;padding-top:40px;position:relative;background-image:linear-gradient(var(--clap),var(--clap)),var(--stripe);background-size:100% 4px,100% 22px;background-repeat:no-repeat;background-position:0 18px,0 0;box-shadow:0 20px 50px rgba(0,0,0,.45)}
.paper h2{font-size:34px;line-height:1.05;margin-bottom:6px}
.paper h3{font-size:25px}
.eyebrow{font-family:'Hanken Grotesk',system-ui,sans-serif;font-weight:400;font-size:12px;letter-spacing:.16em;color:var(--ink);text-transform:uppercase}
.paper .eyebrow,.sheet .eyebrow{display:block;padding-bottom:8px;margin-bottom:10px;border-bottom:2.5px solid var(--ink)}
.on-dark .eyebrow,.topbar .eyebrow{color:#fff}
/* buttons: pastel slates */
.btn{font-family:'Cortesia',cursive;font-weight:400;font-size:21px;line-height:1.1;border-radius:14px;padding:11px 18px 12px;border:2.2px solid #3a3b3e;background:#fff;color:var(--ink);box-shadow:0 4px 12px rgba(0,0,0,.18)}
.btn.small{font-size:17px;padding:7px 13px 8px;border-radius:11px}
.btn.primary,.paper .btn.primary,.sheet .btn.primary,.stack>.btn.primary{background:#d9ecd0;border:2.2px solid #2e9a4f;color:var(--ink);box-shadow:0 4px 12px rgba(0,0,0,.18)}
.btn.gold,.paper .btn.gold,.sheet .btn.gold{background:#fdf5db;border:2.2px solid #e2b93a;color:var(--ink)}
.paper .btn,.sheet .btn{border-color:#3a3b3e;background:#fff;color:var(--ink)}
.btn.ghost,.stack>.btn:not(.primary),.tctl .btn:not(.gold):not(.primary){background:rgba(20,22,24,.55);border-color:rgba(255,255,255,.65);color:#fff;box-shadow:none}
.paper .btn.ghost,.sheet .btn.ghost{background:transparent;color:var(--ink);border-color:#9fa2a6}
.btn:hover:not(:disabled){transform:translateY(-1px)}
.btn .ic{width:20px;height:20px;vertical-align:-4px}
.link{font-family:'Hanken Grotesk',system-ui,sans-serif;color:#fff}
.paper .link,.sheet .link{color:#1f5f8f}
.on-dark .link,.on-dark>.link{background:rgba(20,22,24,.55);border-radius:10px;padding:6px 12px;color:#fff}
/* choices & tiles */
.choice,.stile{border:2px solid var(--line);background:#fff;border-radius:14px}
.choice:hover,.stile:hover{border-color:#2b6f9e}
.choice.sel{border-color:#2b6f9e;background:#dcebf8}
.choice b{font-family:'Cortesia',cursive;font-weight:400;font-size:24px;line-height:1.1}
.choice b .ic,.st-val .ic{width:20px;height:20px;vertical-align:-3px;color:#2b6f9e}
.stile.changed{border-color:var(--cran);background:#fff6f4}
.st-val{font-family:'Hanken Grotesk',system-ui,sans-serif;font-weight:600;font-size:14px}
.st-n{background:var(--ink)}
.sround{background:#ebeced;border:1.5px solid var(--line)}
.sr-title,.sg-h{font-family:'Cortesia',cursive;font-weight:400;font-size:22px}
.sg-h{border-bottom:2.5px solid var(--ink);padding-bottom:4px}
.tag{background:#ebeced;color:#3a3b3e;font-weight:500}
.tag.red{background:#f8dcdc;color:var(--cran)}.tag.green{background:#d9ecd0;color:#22703a}
label.f{font-weight:600}
input.t,textarea.t,select.t{border:1.5px solid #c4c7cb;border-radius:10px;font-family:'Hanken Grotesk',system-ui,sans-serif}
input.t:focus,textarea.t:focus,select.t:focus{border-color:#2b6f9e;box-shadow:0 0 0 3px rgba(43,111,158,.18)}
details.sec{border-color:var(--line)}
details.sec>summary{font-family:'Cortesia',cursive;font-weight:400;font-size:22px}
.item{background:#ebeced;border-color:var(--line)}
.sugbtn{font-family:'Hanken Grotesk',system-ui,sans-serif;font-weight:500;border:1.5px solid #e2b93a;background:#fdf5db;color:#5a4710;border-radius:8px}
.sugbtn:hover{background:#faeab8}
.mech .ico{font-size:28px;color:#2b6f9e}
.mech .ico .ic{width:34px;height:34px}
.hico{color:#2b6f9e}.hico .ic{width:24px;height:24px}
.hflow span{background:#ebeced;border-color:var(--line);font-weight:500}
.hflow i{color:var(--cran)}
.hsweet{background:#fdf5db;border:2px solid #e2b93a}
.hsweet .big{font-family:'Redbell','Cortesia',cursive;color:var(--ink);font-size:46px}
.htab{font-family:'Hanken Grotesk',system-ui,sans-serif;font-weight:500;border-radius:9px}
.htab.on{background:var(--ink);border-color:var(--ink)}
.htable th,.kv b,.mcard dt,.faq b,.hopts b{color:var(--cran)}
.hcheck li::before{border-color:var(--ink)}
/* round headers = full clapperboards */
.round-head,.winner,.tvgrid h1{position:relative;display:block;background:var(--paper);color:var(--ink);text-align:center;border-radius:18px;border:1.5px solid #cfd1d4;margin:62px 4px 14px;padding:22px 20px 16px;box-shadow:0 16px 32px rgba(0,0,0,.4);transform:rotate(-1.2deg)}
.round-head::before,.winner::before,.tvgrid h1::before{content:'';position:absolute;left:-1.5px;right:-1.5px;top:-34px;height:36px;margin:0;width:auto;border-radius:8px 8px 0 0;background:radial-gradient(circle at 20px 18px,#9a9a9e 0 6px,transparent 7px),linear-gradient(90deg,var(--clap) 0 42px,transparent 42px),var(--stripe);box-shadow:inset 0 0 0 5px var(--clap)}
.round-head::after,.winner::after,.tvgrid h1::after{content:'';position:absolute;left:-1.5px;width:calc(100% + 3px);top:-70px;height:30px;border-radius:6px;background:linear-gradient(90deg,var(--clap) 0 42px,transparent 42px),var(--stripe);box-shadow:inset 0 0 0 5px var(--clap);transform:rotate(-6deg);transform-origin:8px 100%}
.round-head .eyebrow,.winner .eyebrow{color:var(--ink)!important;display:block;text-align:left;padding-bottom:8px;margin-bottom:6px;border-bottom:2.5px solid var(--ink)}
.round-head h2,.winner h2,.winner h1{font-family:'Redbell','Cortesia',cursive;font-weight:400;color:var(--ink);font-size:44px;line-height:1.05;margin:8px 0 4px}
.round-head p,.winner p{color:#44474b!important;font-size:15px}
.slrow{display:flex;border-top:2.5px solid var(--ink);margin:12px -20px -16px;font-family:'Hanken Grotesk',system-ui,sans-serif;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.slrow>div{flex:1;padding:8px 10px 10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:0}
.slrow>div+div{border-left:2.5px solid var(--ink)}
.slrow>div:first-child{flex:1.6;text-align:left;align-items:flex-start;justify-content:center}
.slrow i{font-family:'Redbell','Cortesia',cursive;font-style:normal;font-size:30px;letter-spacing:0;line-height:1;text-transform:none}
.winner .crown{width:84px;height:84px;margin:0 auto -4px}
.winner .crown.big{width:140px;height:140px}
.winner .crown svg{width:100%;height:100%;filter:drop-shadow(0 4px 6px rgba(0,0,0,.25))}
.tvgrid h1{width:fit-content;max-width:90%;margin:70px auto 20px;padding:18px 40px;font-family:'Redbell','Cortesia',cursive;font-weight:400;font-size:56px;color:var(--ink)}
/* game chrome */
.topbar{background:rgba(20,22,24,.62);border-radius:14px;padding:6px 6px 6px 16px;backdrop-filter:blur(4px)}
.topbar .ttl{font-family:'Cortesia',cursive;font-size:21px}
.topbar .btn.ghost{padding:7px 9px;border-color:rgba(255,255,255,.4)}
.code-pill{font-family:'Hanken Grotesk',system-ui,sans-serif;border-radius:8px}
.steps{height:22px;gap:4px;padding:5px 8px;border-radius:4px;background:#161617;position:relative;align-items:stretch;
 background-image:repeating-linear-gradient(90deg,#f4f4f2 0 5px,transparent 5px 12px),repeating-linear-gradient(90deg,#f4f4f2 0 5px,transparent 5px 12px);background-size:100% 3px,100% 3px;background-position:0 1px,0 calc(100% - 1px);background-repeat:no-repeat}
.steps i{height:auto;border-radius:2px;background:#3b3c3f}
.steps i.on{background:#9fc79b}
.steps i.now{background:#f6e7ad;box-shadow:0 0 8px rgba(246,231,173,.8)}
.cue{background:#fdf5db;color:var(--ink);border:2px solid #e2b93a;font-style:normal;border-radius:12px}
.cue-l{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#7a6418;margin-bottom:2px}
.timer{font-family:'Hanken Grotesk',system-ui,sans-serif;font-weight:400;background:var(--paper);color:var(--ink);border-top:none;border-radius:16px;padding:12px 28px;position:relative;margin:34px auto 14px;font-variant-numeric:tabular-nums;border:1.5px solid #cfd1d4}
.timer::before{content:'';position:absolute;left:-1.5px;right:-1.5px;top:-20px;height:22px;border-radius:7px 7px 0 0;background:var(--stripe);box-shadow:inset 0 0 0 4px var(--clap)}
.timer.low{color:var(--cran)}
.bigdie{font-family:'Redbell','Cortesia',cursive;font-weight:400;border:2px solid #3a3b3e;background:#fff}
.bigdie .ic{width:48px;height:48px;color:#2b6f9e}
.bigdie.cardback{background:repeating-linear-gradient(-55deg,#d8392f 0 10px,#1f8a4c 10px 20px);border:6px solid #fff;box-shadow:0 0 0 2px #3a3b3e}
.marquee{font-family:'Redbell','Cortesia',cursive;font-weight:400;border:2px solid #3a3b3e;background:#fff;font-size:30px}
.reveal-title{font-family:'Redbell','Cortesia',cursive;font-weight:400;font-size:38px}
.reveal-place{font-family:'Redbell','Cortesia',cursive;color:var(--ink)}
.quote{font-family:'Hanken Grotesk',system-ui,sans-serif;font-style:normal;border-left-color:var(--cran)}
.mcard{border-radius:16px;border-top:none;background:var(--paper)}
.mcard .top{background:#fff;border-top:8px solid var(--pc,var(--cran));border-bottom:2.5px solid var(--ink)}
.mcard .nm{font-family:'Redbell','Cortesia',cursive;font-weight:400;font-size:30px}
.pb-title{font-family:'Redbell','Cortesia',cursive;font-weight:400;color:var(--ink)}
.pb-tag{font-family:'Hanken Grotesk',system-ui,sans-serif;font-style:normal;color:#44474b}
.code-big{font-family:'Hanken Grotesk',system-ui,sans-serif;font-weight:400;color:var(--ink)}
.footer-bar{background:rgba(22,22,23,.96);border-top:none;box-shadow:0 -1px 0 rgba(255,255,255,.08)}
.footer-bar::before{content:'';position:absolute;left:0;right:0;top:-8px;height:8px;background:var(--stripe)}
.lede,.fine{background:rgba(246,246,244,.95);color:var(--ink);border-radius:12px}
#toast{background:#1d1d1f;font-family:'Hanken Grotesk',system-ui,sans-serif;border-radius:12px}
.spin-ld{border-top-color:#2e9a4f}
.tally .bar{background:#2e9a4f}
.smeter .bar i{background:#2e9a4f!important}
.slegend i{border-color:var(--cran)}

const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nl2p=s=>String(s||'').split(/\n\s*\n/).map(p=>`<p>${esc(p).replace(/\n/g,'<br>')}</p>`).join('');
const rid=(n=8)=>Math.random().toString(36).slice(2,2+n)+Math.random().toString(36).slice(2,4);
const clone=o=>JSON.parse(JSON.stringify(o));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function code4(){const L='BCDFGHJKLMNPQRSTVWXZ';let s='';for(let i=0;i<4;i++)s+=L[Math.floor(Math.random()*L.length)];return s;}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function isObj(v){return v&&typeof v==='object'&&!Array.isArray(v);}
function merge(t,p){const o=isObj(t)?{...t}:{};for(const k in p){const v=p[k];if(isObj(v)&&isObj(o[k]))o[k]=merge(o[k],v);else o[k]=v;}return o;}
function safeSeg(s){return String(s).replace(/[^A-Za-z0-9_\-~:@+]/g,'_').slice(0,120)||'x';}
function ls(k,v){try{if(v===undefined){const r=localStorage.getItem(k);return r?JSON.parse(r):null;}if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,JSON.stringify(v));}catch(e){return null;}}
function toast(msg,ms=2600){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),ms);}
function fmt(ms){ms=Math.max(0,ms);const s=Math.ceil(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function getPath(o,path){return path.split('.').reduce((a,k)=>a==null?a:a[k],o);}
function setPath(o,path,v){const ks=path.split('.');let c=o;for(let i=0;i<ks.length-1;i++){if(c[ks[i]]==null)c[ks[i]]={};c=c[ks[i]];}c[ks[ks.length-1]]=v;}
function chime(){try{const A=window.AudioContext||window.webkitAudioContext;if(!A)return;const c=chime.c||(chime.c=new A());[0,0.18,0.36].forEach((d,i)=>{const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=[784,988,1319][i];g.gain.setValueAtTime(0.0001,c.currentTime+d);g.gain.exponentialRampToValueAtTime(0.25,c.currentTime+d+0.02);g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+d+0.6);o.connect(g).connect(c.destination);o.start(c.currentTime+d);o.stop(c.currentTime+d+0.7);});}catch(e){}}
function confetti(){const cs=['#d4ab55','#a3162f','#fff','#1f6b4f','#f0d595'];for(let i=0;i<70;i++){const d=document.createElement('div');d.className='confetti';d.style.left=Math.random()*100+'vw';d.style.background=cs[i%cs.length];d.style.animationDelay=Math.random()*0.8+'s';d.style.borderRadius=Math.random()>.5?'50%':'2px';document.body.appendChild(d);setTimeout(()=>d.remove(),3800);}}

/* ------------------------------------------------------------------ stores */
class LocalStore{
  constructor(data){this.d=data||{game:null,players:{},slips:{},votes:{}};this.cbs=[];this.online=false;}
  sub(cb){this.cbs.push(cb);cb(this.d);}
  emit(){ls('hmh_local',this.d);this.cbs.forEach(c=>c(this.d));}
  async createGame(g){this.d={game:g,players:{},slips:{},votes:{}};this.emit();}
  async updateGame(p){this.d.game=merge(this.d.game,p);this.emit();}
  async setPlayer(id,p){this.d.players={...this.d.players,[id]:p};this.emit();}
  async updatePlayer(id,p){this.d.players={...this.d.players,[id]:merge(this.d.players[id],p)};this.emit();}
  async removePlayer(id){const ps={...this.d.players};delete ps[id];this.d.players=ps;this.emit();}
  async setSlip(id,s){this.d.slips={...this.d.slips,[id]:s};this.emit();}
  async setVote(id,v){this.d.votes={...this.d.votes,[id]:v};this.emit();}
  stop(){this.cbs=[];}
}
class DbStore{
  constructor(db,code){this.db=db;this.code=code;this.base='games/'+code;this.d={game:null,players:{},slips:{},votes:{}};this.cbs=[];this.unsubs=[];this.q={};this.online=true;this.loaded=false;}
  chain(path,fn){const p=(this.q[path]||Promise.resolve()).then(fn,fn);this.q[path]=p.catch(()=>{});return p;}
  sub(cb){
    this.cbs.push(cb);
    const emit=()=>this.cbs.forEach(c=>c(this.d));
    const onErr=e=>{if(e&&e.code==='revoked'){toast('Access to this game was withdrawn.');}else console.warn(e);};
    this.unsubs.push(this.db.doc(this.base).onSnapshot(s=>{this.loaded=true;this.d={...this.d,game:s.exists?s.data():null};emit();},onErr));
    const col=(name,key)=>this.unsubs.push(this.db.collection(this.base+'/'+name).onSnapshot(s=>{const m={};s.docs.forEach(d=>{m[d.id]=d.data();});this.d={...this.d,[key]:m};emit();},onErr));
    col('players','players');col('slips','slips');col('votes','votes');
  }
  w(path,fn){return this.chain(path,()=>fn(this.db.doc(path))).catch(e=>{writeError(e);throw e;});}
  createGame(g){return this.w(this.base,r=>r.set(g));}
  updateGame(p){return this.w(this.base,r=>r.update(p));}
  setPlayer(id,p){return this.w(this.base+'/players/'+id,r=>r.set(p));}
  updatePlayer(id,p){return this.w(this.base+'/players/'+id,r=>r.update(p));}
  removePlayer(id){return this.w(this.base+'/players/'+id,r=>r.delete());}
  setSlip(id,s){return this.w(this.base+'/slips/'+id,r=>r.set(s));}
  setVote(id,v){return this.w(this.base+'/votes/'+id,r=>r.set(v));}
  stop(){this.unsubs.forEach(u=>{try{u()}catch(e){}});this.unsubs=[];this.cbs=[];}
}
function writeError(e){
  if(e&&e.code==='invalid_argument')toast("Your account can't save to this game. Ask the host to invite you as an Editor, or to add you as a player on their device.",6000);
  else if(e&&e.code==='rate_limited'||e&&e.code==='resource_exhausted')toast('Whoa, slow down a sec and try again.');
  else toast('Could not save. Check your connection and try again.');
}

function takenMap(key,exceptId){
  const m={};const ps=plist();const items=itemsFor(key);

function vGame(){
  const g=S.game;
  if(!g){return `<div class="paper center"><span class="spin-ld"></span> Finding your game…<p class="small muted">If this takes long, the code may be wrong.</p><button class="btn" data-act="leave">Back</button></div>`;}
  if(S.tv)return vTV();
  const idx=PHASES.indexOf(g.phase);
  const top=`<div class="topbar"><span class="ttl">${esc(g.content.title)}</span><span class="spacer"></span>${S.store.online?`<span class="code-pill">${esc(g.code)}</span>`:''}<button class="btn small ghost" data-act="tv" title="Big-screen view" aria-label="Big-screen view">${ic('tv')}</button><button class="btn small ghost" data-act="menu" aria-label="Menu">${ic('menu')}</button></div>
    <div class="steps">${PHASES.slice(1).map((p,i)=>`<i class="${i+1<idx?'on':i+1===idx?'now':''}"></i>`).join('')}</div>`;
  let body='';
  switch(g.phase){
    case 'lobby':body=vLobby();break;
    case 'intro':body=vIntro();break;
    case 'name':case 'career':case 'motive':case 'hunk':body=vRound(g.phase);break;
    case 'twist':body=vTwist();break;
    case 'prep':body=vPrep();break;
    case 'pitch':body=vPitch();break;
    case 'vote':body=vVote();break;
    case 'results':body=vResults();break;

  return top+body+hostBar();
}

    ${drawn?'<p class="small muted" style="margin-top:10px">You must use every detail from your slip in your pitch.</p>':''}</div>`;

function tally(){const t={};Object.entries(S.votes).forEach(([vid,v])=>{if(S.players[vid]&&v&&S.players[v.target])t[v.target]=(t[v.target]||0)+1;});return t;}

function recapText(){
  const c=C(),ps=plist(),t=tally();const max=Math.max(0,...Object.values(t));
  const winners=ps.filter(p=>max>0&&t[p.id]===max);
  const ttl=p=>(p.pitch&&p.pitch.title)||fullName(p)||p.name;
  const L=[];
  L.push((c.title||'Blank for Christmas')+': the movies we made');
  L.push('');
  if(winners.length)L.push((winners.length>1?'GREENLIT (tie): ':'GREENLIT: ')+winners.map(w=>ttl(w)+' (pitched by '+w.name+')').join(' & '));
  ps.slice().sort((a,b)=>(t[b.id]||0)-(t[a.id]||0)).forEach(p=>{
    const m=c.motives[p.motive],h=c.hunks[p.hunk],sl=slipOf(p),pp=p.pitch||{};
    L.push('');L.push('------------------------------');
    L.push(ttl(p).toUpperCase());
    if(pp.tagline)L.push('"'+pp.tagline+'"');
    L.push('Pitched by '+p.name+' · '+(t[p.id]||0)+' vote'+((t[p.id]||0)===1?'':'s'));
    if(fullName(p))L.push('Starring: '+fullName(p));
    if(p.career!=null)L.push('Holiday calling: '+c.careers[p.career]);
    if(m)L.push('Reason for coming home: '+m.title);
    if(h)L.push('Love interest: '+h.title+(h.redflag?' (red flag: '+h.redflag+')':''));
    if(sl&&sl.answers)c.twistQuestions.forEach((q,i)=>{if(sl.answers[i])L.push('Twist: '+q+' '+sl.answers[i]);});
    if(pp.plot){L.push('');L.push(pp.plot);}
  });
  L.push('');L.push('------------------------------');
  L.push("Blank for Christmas is an original game from Marco's Funhouse.");
  L.push('More ridiculous stuff in the Gooseletter: '+MF.goose);
  return L.join('\n');
}

function normalizeSetup(o){const d=newDraft('custom');const c=o.content||o;
  ['firstNames','lastNames','careers','twistQuestions'].forEach(k=>{if(Array.isArray(c[k])&&c[k].length)d.content[k]=c[k].map(x=>String(x)).filter(Boolean);});
  if(Array.isArray(c.motives)&&c.motives.length)d.content.motives=c.motives.map(m=>({place:String(m.place||''),title:String(m.title||''),text:String(m.text||'')}));
  if(Array.isArray(c.hunks)&&c.hunks.length)d.content.hunks=c.hunks.map(h=>({title:String(h.title||''),backstory:String(h.backstory||''),vibe:String(h.vibe||''),line:String(h.line||''),redflag:String(h.redflag||''),verdict:String(h.verdict||'')}));
  ['title','intro','openingCue'].forEach(k=>{if(typeof c[k]==='string'&&c[k].trim())d.content[k]=c[k];});
  while(d.content.twistQuestions.length<3)d.content.twistQuestions.push(MARCO.twistQuestions[d.content.twistQuestions.length]);
  d.content.twistQuestions=d.content.twistQuestions.slice(0,3);
  const m=o.mechanics||{};ROUND_KEYS.concat('twist').forEach(k=>{if(ROUND_PRESETS[k].includes(m[k]))d.mechanics[k]=m[k];});
  if(isObj(o.custom))ROUND_KEYS.forEach(k=>{if(typeof o.custom[k]==='string')d.custom[k]=o.custom[k];});
  const cues=o.cues||{};['name','career','motive','hunk','twist'].forEach(k=>{if(typeof cues[k]==='string')d.cues[k]=cues[k];});
  if(isObj(o.settings)){if(+o.settings.prepMin)d.settings.prepMin=+o.settings.prepMin;if(+o.settings.pitchMin)d.settings.pitchMin=+o.settings.pitchMin;}
  SETUP_ROUNDS.forEach(r=>{d.prompts[r.k]=promptModeFor(d.content,r.k);});
  return d;}

A.aiGenerate=async()=>{
  const sample=S.caps.sample;if(!sample)return;const f=S.ui.ai;
  const propsHave=Object.entries(f.props).filter(([k,v])=>v).map(([k])=>({dice:'dice',cards:'a deck of playing cards',cups:'solo cups and ping pong balls',village:'a Christmas village / decorations to point at',hat:'a hat or bowl'}[k]));
  const allowed=Object.fromEntries(ROUND_KEYS.map(k=>[k,ROUND_PRESETS[k].map(id=>`${id} (${PRESETS[id].label}${PRESETS[id].prop&&id!=='custom'?', needs '+PRESETS[id].prop:''})`)]));
  const prompt=`You write content for a party game called "Blank for Christmas", a collaborative storytelling game. Each player builds a cheesy made-for-TV Christmas movie from randomized pieces (a festive name, a career, a reason to come home, a love interest, and a twist), then pitches it to the group, who vote.

Here is the original game's tone, for reference (do not copy it, use it as a style guide):
- Names: Holly, Tinsel, Pepper / Snow, Ham, Menorah
- Careers: Whimsical Dolphin Trainer, Creepy Puppeteer, Mall Mrs. Claus
- Motive example: {"place":"The Skating Rink","title":"Wrapping Lies & Big Red Bows","text":"Dad is retiring and wants to sell you the family wrapping paper company. The catch? He wants to finally meet your fiancé. One tiny problem: you don't have a fiancé."}
- Love interest example: {"title":"The Small-Town Carpenter","backstory":"Moved home to take over his grandfather's workshop.","vibe":"Smells like pine, sawdust, and emotional availability.","line":"What if I built us something... together?","redflag":"Owns seven whittling knives and names each one.","verdict":"Is he building a birdhouse or holding a staff meeting with his knives?"}

THIS GROUP:
- Players: ${f.players||'(not given)'}
- Inside jokes and shared history: ${f.jokes||'(none given; keep it broadly funny)'}
- Setting / vibe: ${f.setting||'a classic snowy small town'}
- Spice level: ${f.spice} (${{wholesome:'family-friendly, no innuendo',cheeky:'light grown-up innuendo, never explicit',unhinged:'chaotic, absurd, surreal; still never explicit or mean'}[f.spice]})
- Props available: ${propsHave.length?propsHave.join(', '):'none, everything must be digital'}

Weave the inside jokes into roughly a third of the items so they feel personal, and keep the rest classic made-for-TV Christmas movie parody. Be affectionate, never cruel; never mock anyone's body, identity or real hardship. Follow the group's lead on who the love interests should be; default to men.

Choose how each round is randomized. Only pick a mechanic whose prop is available; otherwise pick a digital one. Allowed ids:
${ROUND_KEYS.map(k=>`- ${k}: ${allowed[k].join('; ')}`).join('\n')}
If you pick "custom" for a round, write a short physical challenge for it in custom.<round> (using the props or the room, ending with the player tapping a numbered tile on screen). Use custom at most once, only when it would be extra fun.

Return ONLY a JSON object, no prose, with exactly this shape:
{"title":"game title, e.g. A Very [Group] Holiday","intro":"welcome narration, 2 short paragraphs separated by a blank line, second person plural","openingCue":"one host stage direction to kick things off","firstNames":[12 festive first names],"lastNames":[12 festive surnames, puns welcome],"careers":[8 short funny job titles],"motives":[8 objects {"place","title","text"}; place is a short village location name, text is 2-3 dramatic sentences in second person],"hunks":[8 objects {"title","backstory","vibe","line","redflag","verdict"}],"twistQuestions":[3 questions players answer secretly that become plot twists],"cues":{"name":"","career":"","motive":"","hunk":"","twist":""},"mechanics":{"name":"id","career":"id","motive":"id","hunk":"id"},"custom":{}}
cues are optional one-line host stage directions per round (use inside jokes where natural; empty string is fine).`;
  S.busy=true;S.ui.aiErr=null;render();
  try{
    let out;
    if(typeof sample.json==='function')out=await sample.json(prompt,{modelTier:'default'});
    else{const r=await sample(prompt,{modelTier:'default'});const t=r.text||'';out=JSON.parse(t.slice(t.indexOf('{'),t.lastIndexOf('}')+1));}
    if(!isObj(out))throw new Error('bad');
    const d=normalizeSetup(out);d.version='ai';SETUP_ROUNDS.forEach(r=>{d.prompts[r.k]='ai';});S.draft=d;S.view='setup';
  }catch(e){
    S.ui.aiErr=e&&e.code==='limit'?'That\'s the AI limit for this game. Your own ideas still work!':e&&e.code==='rate_limited'?'Claude needs a breather. Try again in a minute.':e&&e.code==='not_granted'?'AI suggestions aren\'t enabled here.':'That didn\'t come back right. Try again.';
  }
  S.busy=false;render();window.scrollTo(0,0);
};

A.createGame=async()=>{
  const d=S.draft;const c=d.content;
  c.firstNames=c.firstNames.filter(Boolean);c.lastNames=c.lastNames.filter(Boolean);c.careers=c.careers.filter(Boolean);
  c.motives=c.motives.filter(m=>m.title||m.text);c.hunks=c.hunks.filter(h=>h.title);
  if(!c.firstNames.length||!c.lastNames.length||!c.careers.length||!c.motives.length||!c.hunks.length){toast('Every list needs at least one item.');return;}
  d.version=(SETUP_ROUNDS.every(r=>promptModeFor(c,r.k)==='marco')&&!introChanged(d))?'marco':'custom';
  if(d.version!=='marco')saveSetup(d);
  const online=d.playMode==='online'&&S.caps.db;if(d.playMode==='host')d.settings.kitPlayers=d.settings.kitPlayers||8;
  const g={code:code4(),version:d.version,content:c,mechanics:d.mechanics,custom:d.custom,cues:d.cues,settings:d.settings,phase:'lobby',hostId:null,createdAt:Date.now(),
    prep:{endsAt:null,left:d.settings.prepMin*60000},pitch:{endsAt:null,left:d.settings.pitchMin*60000},twists:null,pitchOrder:[],pitchIdx:0};
  S.busy=true;render();
  try{
    if(online){S.myUid=await myUid();g.hostId=S.myUid;openStore(new DbStore(S.caps.db,g.code));await S.store.createGame(g);ls('hmh_session',{mode:'online',code:g.code});}
    else{S.myUid='local';g.hostId='local';openStore(new LocalStore());await S.store.createGame(g);ls('hmh_session',{mode:'local'});}
    S.view='game';
  }catch(e){console.warn(e);}
  S.busy=false;render();window.scrollTo(0,0);
};

A.advance=async el=>{
  const to=el.dataset.to;const g=S.game;const ps=plist();
  if(ROUND_KEYS.includes(g.phase)){const left=ps.filter(p=>!isDone(p,g.phase)).length;if(left&&!el.dataset.sure){el.dataset.sure='1';el.textContent=`${left} haven't gone. Skip anyway?`;return;}}
  if(g.phase==='vote'){const left=ps.filter(p=>!S.votes[p.id]).length;if(left&&!el.dataset.sure){el.dataset.sure='1';el.textContent=`${left} haven't voted. Reveal anyway?`;return;}}
  const patch={phase:to};
  if(to==='prep')patch.prep={endsAt:null,left:g.settings.prepMin*60000};
  if(to==='pitch'){patch.pitchOrder=shuffle(ps.map(p=>p.id));patch.pitchIdx=0;patch.pitch={endsAt:null,left:g.settings.pitchMin*60000};}
  await S.store.updateGame(patch);
};

async function commit(key,pid,i,step){
  const p=S.players[pid];if(!p)return;
  if(key!=='name'){const t=takenMap(key,pid);if(t[i]){toast(`Just claimed by ${t[i].name}!`);render();return;}}
  else if(mechOf('name').kind==='random'){const t=takenNames(step,pid);if(t[i]){toast(`${t[i].name} just got that one. Roll again!`);render();return;}}
  const patch=key==='name'?{[step]:i}:{[key]:i};
  let send=patch;
  if(S.web&&S.store&&S.store.online){const f=key==='name'?step:key;const uniq=key==='name'?(mechOf('name').kind==='random'&&C()[step==='first'?'firstNames':'lastNames'].length>=plist().length):itemsFor(key).length>=plist().length;if(uniq)send={...patch,_uniq:[f]};}
  try{await S.store.updatePlayer(pid,send);}catch(e){if(e&&e.code==='taken'){toast('Someone grabbed that one a split second earlier. Roll again!');render();}return;}
  const np={id:pid,...S.players[pid],...patch};
  if(key==='name'&&step==='first'){toast(`First name: ${C().firstNames[i]}! Now your last name.`);return;}
  S.acting=null;render();showReveal(key,np,true);
}

A.roll=async el=>{
  if(S.rolling)return;S.rolling=true;el.disabled=true;
  const key=el.dataset.key,pid=el.dataset.id,step=el.dataset.step;const c=C();
  let pool,labels;
  if(key==='name'){const list=step==='first'?c.firstNames:c.lastNames;const t=takenNames(step,pid);pool=list.map((_,i)=>i).filter(i=>!t[i]);if(!pool.length)pool=list.map((_,i)=>i);labels=list;}
  else{const t=takenMap(key,pid);pool=itemsFor(key).filter(it=>!t[it.i]).map(it=>it.i);labels=itemsFor(key).map(it=>key==='motive'?it.place:it.label);}
  if(!pool.length){S.rolling=false;return;}
  const pick=pool[Math.floor(Math.random()*pool.length)];
  const die=$('#die'),mq=$('#mq');if(die)die.classList.add('spin');
  const style=mechOf(key).style;
  for(let k=0;k<16;k++){const r=pool[Math.floor(Math.random()*pool.length)];if(die)die.textContent=style==='cards'?(RANKS[r]||r+1)+SUITS[r%4]:style==='dice'?String(r+1):die.textContent;if(mq)mq.textContent=labels[r];await sleep(60+k*12);}
  if(die){die.classList.remove('spin');die.textContent=style==='cards'?(RANKS[pick]||pick+1)+SUITS[pick%4]:style==='dice'?String(pick+1):die.textContent;}
  if(mq)mq.textContent=labels[pick];
  await sleep(500);S.rolling=false;
  commit(key,pid,pick,step);
};

A.drawHat=async()=>{
  const ids=plist().map(p=>p.id);const slipIds=Object.keys(S.slips).filter(id=>S.players[id]);
  if(!slipIds.length)return;
  let best=null;
  for(let t=0;t<200;t++){
    let pool=shuffle(slipIds);const map={};let fixed=0;
    ids.forEach((pid,k)=>{if(!pool.length)pool=shuffle(slipIds);const s=pool.shift();map[pid]=s;if(s===pid)fixed++;});
    if(!best||fixed<best.f)best={m:map,f:fixed};if(fixed===0||slipIds.length<2)break;
  }
  await S.store.updateGame({twists:best.m});confetti();
};

A.emailRecap=()=>{const to=(($('#recapEmail')||{}).value||'').trim();const c=C();

function sugBtn(attrs,label){return `<button type="button" class="sugbtn" data-act="suggest" ${attrs}>${label||'Suggest'}</button>`;}
function pickFrom(arr,avoid){const key=x=>typeof x==='string'?x:x.title;const pool=arr.filter(x=>!avoid.includes(key(x)));const src=pool.length?pool:arr;return src[Math.floor(Math.random()*src.length)];}
A.suggest=async el=>{
  const k=el.dataset.kind;
  if(k==='text'){const path=el.dataset.path;const cur=getPath(S,path);const avoid=[cur];if(el.dataset.bank==='tq')avoid.push(...S.draft.content.twistQuestions);setPath(S,path,pickFrom(BANK[el.dataset.bank],avoid));render();return;}
  if(k==='list'){const l=el.dataset.list;const list=S.draft.content[l];const v=pickFrom(BANK[l],list.map(x=>x&&x.title?x.title:x));list.push(isObj(v)?clone(v):v);render();toast('Added: '+(isObj(v)?v.title:v));return;}
  if(k==='item'){const l=el.dataset.list,i=+el.dataset.i;const list=S.draft.content[l];const it=list[i];const sug=clone(pickFrom(BANK[l],list.map(x=>x.title)));
    const keys=Object.keys(sug);const blanks=keys.filter(f=>!(it[f]||'').trim());
    if(blanks.length===0||blanks.length===keys.length)list[i]=sug;else blanks.forEach(f=>{it[f]=sug[f];});render();return;}
  if(k==='pitchTitle'||k==='pitchTagline'||k==='pitchPlot'){const pid=el.dataset.pid;const p={id:pid,...S.players[pid]};const d=pitchDraft(pid);
    if(k==='pitchTitle')d.title=pitchTitleIdea(p);else if(k==='pitchTagline')d.tagline=pitchTaglineIdea(p);else{if(d.plot.trim()&&!el.dataset.sure){el.dataset.sure='1';el.textContent='Replace your plot?';return;}d.plot=pitchPlotStarter(p);}
    render();return;}
  if(k==='slip'){const pid=el.dataset.pid,qi=+el.dataset.qi;const q=C().twistQuestions[qi];const d=S.ui.slipDraft||(S.ui.slipDraft={});const a=d[pid]||(d[pid]=['','','']);
    const idx=MARCO.twistQuestions.indexOf(q);let v;
    const used=Object.values(d).map(x=>x[qi]);
    if(idx>=0)v=pickFrom(BANK['twist'+idx],used);
    else if(S.caps.sample){el.disabled=true;el.textContent='…';try{const r=await S.caps.sample(`A party game about cheesy made-for-TV Christmas movies. Give ONE short, funny, specific answer (max 18 words) to this question, which will become a plot twist: "${q}". Avoid these: ${used.filter(Boolean).join(' | ')||'none'}. Reply with only the answer, no quotes.`,{modelTier:'quick',cache:false});v=(r.text||'').trim().replace(/^["']|["']$/g,'');}catch(e){}if(!v)v=pickFrom(BANK.generic,used);}
    else v=pickFrom(BANK.generic,used);
    a[qi]=v;render();return;}
};

function pitchBits(p){
  const c=C(),g=S.game;const first=p.first!=null?c.firstNames[p.first]:p.name;const last=p.last!=null?c.lastNames[p.last]:'';
  const career=p.career!=null?c.careers[p.career]:'Mysterious Professional';const m=c.motives[p.motive];const h=c.hunks[p.hunk];
  const slip=slipOf(p);
  const hk=h?h.title.replace(/^The\s+/i,'').split(/\s+/).slice(-1)[0].replace(/[^A-Za-z-]/g,''):'Stranger';
  const ck=career.split(/\s+/).slice(-1)[0].replace(/[^A-Za-z-]/g,'');
  return {first,last,full:(first+' '+last).trim(),career,careerL:career.toLowerCase(),ck,m,h,hk,slip};
}
function plural(w){return /man$/i.test(w)?w.replace(/man$/i,'men'):/(s|x|ch|sh)$/i.test(w)?w+'es':/[^aeiou]y$/i.test(w)?w.slice(0,-1)+'ies':w+'s';}
function sent(a){a=String(a||'').trim();if(!a)return a;if(!/^(I\b|I'|[A-Z]{2})/.test(a))a=a[0].toLowerCase()+a.slice(1);if(!/[.!?…"')]$/.test(a))a+='.';return a;}

  `${b.career} for Christmas`,`${b.first}'s Very ${L} Christmas`,`The ${L} Before Christmas`,`Deck the ${plural(L)}`,`Jingle All the ${L}`,`It's a Wonderful ${b.ck}`,
  `Mistletoe & ${plural(b.hk)}`,`${b.first} Saves Christmas (Again)`,`A ${b.hk} for the Holidays`,`Home for the ${L}idays`,`Love, Actually ${L}`,`All I Want for Christmas Is a ${b.hk}`,
  `The Twelve ${plural(b.hk)} of Christmas`,`Silent Night, ${b.ck} Night`,`${L} Bells`],[(p.pitch||{}).title]);}
function pitchTaglineIdea(p){const b=pitchBits(p);return pickFrom([
  `This Christmas, ${b.first} is coming home. The ${b.careerL} career is non-negotiable.`,`${b.first} came home for the holidays. The ${b.hk.toLowerCase()} came with a red flag.`,
  `Love is in the air. So is a blizzard.`,`One town. One ${b.ck.toLowerCase()}. Zero chill.`,`Some gifts can't be returned.`,`Home is where the drama is.`,
  `The only thing more twisted than the tinsel is the plot.`,`'Tis the season to make terrible decisions.`,`Unwrap the truth. Then rewrap it. Badly.`,
  `${b.first} has 24 days to save Christmas. And maybe ${plural(b.hk.toLowerCase())}.`,`Snowed in. Fired up. Deeply confused.`,`From the people who brought you every other Christmas movie.`],[(p.pitch||{}).tagline]);}

  if(b.slip){const a=b.slip.answers;t+=` But just as the snow starts falling, everything goes wrong: ${sent(a[0])||'[something unforgivable happens].'} Then on the big morning, ${sent(a[1])||'[disaster strikes].'} And under the tree: ${sent(a[2])||'[the worst gift imaginable].'}`;}

function promptPreview(k){const c=S.draft.content;const li=a=>`<ul class="pprev">${a.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;

  if(k==='career')return li(c.careers);if(k==='motive')return li(c.motives.map(m=>m.place+': '+m.title));if(k==='hunk')return li(c.hunks.map(h=>h.title));return li(c.twistQuestions);}
function promptEditor(k){const c=S.draft.content;

  if(k==='name')return ta('firstNames','First names','One per line. With real dice, 12 is the sweet spot.')+ta('lastNames','Last names','One per line.');

  if(k==='motive')return `<label class="f">Motives <span class="muted small">${c.motives.length}</span></label><p class="small muted" style="margin:0">Players see the place; the title and story are the reveal.</p>`+c.motives.map((m,i)=>`<div class="item"><div class="row"><b class="small">#${i+1}</b>${sugBtn(`data-kind="item" data-list="motives" data-i="${i}"`)}<span class="spacer"></span><button class="link small" data-act="delItem" data-list="motives" data-i="${i}">Remove</button></div>
      <input class="t" data-k="m${i}p" data-bind="draft.content.motives.${i}.place" placeholder="Place (e.g. The Corner Pub)" value="${esc(m.place)}" style="margin:6px 0"><input class="t" data-k="m${i}t" data-bind="draft.content.motives.${i}.title" placeholder="Title" value="${esc(m.title)}" style="margin:6px 0"><textarea class="t" rows="3" data-k="m${i}x" data-bind="draft.content.motives.${i}.text" placeholder="The dramatic setup">${esc(m.text)}</textarea></div>`).join('')+`<button class="btn small" data-act="addItem" data-list="motives">+ Add a motive</button>`;
  if(k==='hunk'){const cache=S.ui.hunkCache||(S.ui.hunkCache={});c.hunks.forEach(h=>{if(h.title)cache[h.title]=h;});
    return `<label class="f">Hunks <span class="muted small">${c.hunks.length}</span> ${sugBtn('data-kind="list" data-list="hunks"','Add a suggestion')}</label><p class="small muted" style="margin:0 0 6px">One hunk per line, e.g. "The Brooding Hockey Coach Who Cries at The Nutcracker." Marco's hunks keep their full backstories; yours can be just the one-liner.</p><textarea class="t" rows="9" data-k="hunklines" data-hunklines="1">${esc(c.hunks.map(h=>h.title).join('\n'))}</textarea>`;}

A.aiList=async el=>{
  const sample=S.caps.sample;if(!sample||S.busy)return;const k=el.dataset.r;const f=S.ui.ai||{};
  const spec={name:'{"firstNames":[12 festive first names],"lastNames":[12 festive surnames, puns welcome]}',career:'{"careers":[8 short funny job titles, some absurd]}',
    motive:'{"motives":[8 objects {"place":"short village location name","title":"Title: Subtitle style","text":"2-3 dramatic sentences in second person"}]}',
    hunk:'{"hunks":[8 objects {"title","backstory","vibe","line","redflag","verdict"}]}',twist:'{"twistQuestions":[3 questions players answer secretly that become plot twists]}'}[k];
  const prompt=`You write content for "Blank for Christmas", a party game. Each player tells the cheesy made-for-TV Christmas movie story of the same woman: she gets a festive name, a questionable job, a dramatic reason to come home, a love interest (a "hunk") and a twist, then pitches the movie to the group.
Style examples (do not copy): names Holly, Tinsel / Snow, Ham; careers "Whimsical Dolphin Trainer", "Mall Mrs. Claus"; motive {"place":"The Skating Rink","title":"Wrapping Lies & Big Red Bows","text":"Dad wants to finally meet your fiancé. One tiny problem: you don't have a fiancé."}; hunk {"title":"The Small-Town Carpenter","backstory":"Moved home to take over his grandfather's workshop.","vibe":"Smells like pine and emotional availability.","line":"What if I built us something... together?","redflag":"Names each of his seven whittling knives.","verdict":"Birdhouse or staff meeting with his knives?"}.
THIS GROUP — inside jokes: ${f.jokes||'(none; keep it broadly funny)'}; setting: ${f.setting||'a classic snowy small town'}; spice: ${f.spice||'cheeky'} (never explicit or mean).
Weave the inside jokes into about a third of the items. Write ONLY this round's content and return ONLY JSON with exactly this shape: ${spec}`;
  S.busy=true;S.ui.aiErr=null;render();
  try{let out;if(typeof sample.json==='function')out=await sample.json(prompt,{modelTier:'default'});else{const r2=await sample(prompt,{modelTier:'default'});const t=r2.text||'';out=JSON.parse(t.slice(t.indexOf('{'),t.lastIndexOf('}')+1));}
    if(!isObj(out))throw new Error('bad');const n=normalizeSetup({content:out});const r=SETUP_ROUNDS.find(x=>x.k===k);let got=0;
    r.lists.forEach(l=>{if(Array.isArray(out[l])&&out[l].length){S.draft.content[l]=n.content[l];got++;}});
    if(!got)throw new Error('empty');S.draft.prompts[k]='ai';
  }catch(e){S.ui.aiErr=e&&e.code==='limit'?'That\'s the AI limit for this game. Your own ideas still work!':e&&e.code==='rate_limited'?'Claude needs a breather. Try again in a minute.':'That didn\'t come back right. Try again.';}
  S.busy=false;render();
};

const firedAt={};

  document.querySelectorAll('[data-timer]').forEach(el=>{const n=el.dataset.timer;const t=S.game&&S.game[n];const ms=timerOf(t);el.textContent=ms<=0&&t&&t.endsAt?"Time's up!":fmt(ms);el.classList.toggle('low',ms>0&&ms<30000);el.classList.toggle('up',ms<=0&&!!(t&&t.endsAt));

function starBowSVG(c){c=c||{};const L=c.light||'#ffffff',D=c.dark||'#e9ebef',M=c.mid||'#f4f5f7',E=c.edge||'rgba(140,145,160,.32)',H=c.hi||'rgba(255,255,255,.95)';
  let ti=0;const T=c.tints;const P=(ang,len,w,base)=>{const L=T?T[ti%T.length]:c.light||'#ffffff',D=T?T[(ti+2)%T.length]:c.dark||'#e9ebef';ti++;const a=ang*Math.PI/180,ca=Math.cos(a),sa=Math.sin(a);const pt=(x,y)=>[(x*ca-y*sa).toFixed(2),(x*sa+y*ca).toFixed(2)].join(' ');
    const tip=pt(0,-len),l=pt(-w,-base),r=pt(w,-base),o=pt(0,0),cl=pt(-w*0.7,-(base+len)*0.55),cr=pt(w*0.7,-(base+len)*0.55),hl=pt(-w*0.42,-base-2),ht=pt(-w*0.12,-len*0.8);
    return `<path d="M${o} L${l} Q${cl} ${tip} Z" fill="${L}" stroke="${E}" stroke-width=".9" stroke-linejoin="round"/><path d="M${o} L${r} Q${cr} ${tip} Z" fill="${D}" stroke="${E}" stroke-width=".9" stroke-linejoin="round"/><path d="M${hl} L${ht}" stroke="${H}" stroke-width="2.2" stroke-linecap="round" opacity=".9"/>`;};
  let g='';
  for(let i=0;i<6;i++)g+=P(i*60+8,47,18,14);
  for(let i=0;i<6;i++)g+=P(i*60+38,39,16,10);
  g+=`<circle r="16" fill="${M}" stroke="${E}" stroke-width=".9"/>`;
  for(let i=0;i<4;i++)g+=P(i*90+22,27,12,4);
  return `<svg viewBox="-50 -50 100 100" xmlns="http://www.w3.org/2000/svg">${g}</svg>`;}
function bowSVG(fill,stroke){stroke=stroke||'rgba(0,0,0,.12)';return `<svg viewBox="0 0 100 82" xmlns="http://www.w3.org/2000/svg"><path d="M46 42 L28 78 L38 72 L45 81 L50 46Z M54 42 L72 78 L62 72 L55 81 L50 46Z" fill="${fill}" stroke="${stroke}" stroke-width="2" stroke-linejoin="round"/><path d="M50 39 C30 6 2 12 6 34 C10 54 36 52 50 39Z M50 39 C70 6 98 12 94 34 C90 54 64 52 50 39Z" fill="${fill}" stroke="${stroke}" stroke-width="2" stroke-linejoin="round"/><path d="M44 36 C32 22 16 22 16 33 M56 36 C68 22 84 22 84 33" fill="none" stroke="${stroke}" stroke-width="2.5" stroke-linecap="round"/><ellipse cx="50" cy="40" rx="9.5" ry="8.5" fill="${fill}" stroke="${stroke}" stroke-width="2"/></svg>`;}
(function(){const s=$('#snow');for(let i=0;i<20;i++){const f=document.createElement('div');f.className='flake bowf';const sz=14+Math.pow(Math.random(),1.6)*58;f.style.width=sz+'px';f.style.height=sz+'px';f.style.left=(Math.random()*100)+'vw';f.style.animationDuration=(12+Math.random()*16)+'s';f.style.animationDelay=(-Math.random()*28)+'s';f.style.opacity=.75+Math.random()*.25;f.innerHTML=starBowSVG();f.firstChild.style.animationDuration=(5+Math.random()*6)+'s';f.firstChild.style.animationDelay=(-Math.random()*6)+'s';s.appendChild(f);}})();
function homeBowSVG(k){
  if(k%3===0)return starBowSVG({tints:['#f9d3e6','#d6dcfa','#d3f0ec','#ecd6f8','#ffffff','#fbe3d2'],mid:'#f3eefb',edge:'rgba(150,140,175,.35)',hi:'rgba(255,255,255,1)'});
  if(k%3===1)return starBowSVG();
  /* sheer organza bow with silver edges */
  const pet=(ang,len,w)=>`<path d="M0 0 C${-w} ${-len*0.35} ${-w*0.9} ${-len} 0 ${-len} C${w*0.9} ${-len} ${w} ${-len*0.35} 0 0Z" transform="rotate(${ang})"/>`;
  let g='<g fill="rgba(255,255,255,.5)" stroke="#c3c8d2" stroke-width="1.4" stroke-linejoin="round">';
  for(let i=0;i<8;i++)g+=pet(i*45,46,17);

/* home clapper: snaps shut on hover/tap and shoots glitter */
(function(){
  let busy=false;
  const COLORS=['#f6dc94','#e2bd62','#ffffff','#dfe3ea','#f9d3e6','#d6dcfa','#d3f0ec','#d8392f','#1f8a4c'];
  function glitter(x,y,w){
    if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
    const n=70;
    for(let i=0;i<n;i++){
      const g=document.createElement('div');g.className='glit';
      const sz=4+Math.random()*7;const star=Math.random()<.3;
      g.style.cssText=`left:${x+(Math.random()-.5)*w}px;top:${y}px;width:${sz}px;height:${sz}px;background:${COLORS[i%COLORS.length]};${star?'clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);':''}`;
      document.body.appendChild(g);
      const ang=-Math.PI/2+(Math.random()-.5)*Math.PI*1.4,sp=140+Math.random()*260;
      const dx=Math.cos(ang)*sp,dy=Math.sin(ang)*sp,fall=260+Math.random()*260,rot=(Math.random()-.5)*900;
      const a=g.animate([{transform:'translate(0,0) rotate(0)',opacity:1},{transform:`translate(${dx*.75}px,${dy*.75}px) rotate(${rot*.5}deg)`,opacity:1,offset:.35},{transform:`translate(${dx}px,${dy+fall}px) rotate(${rot}deg)`,opacity:0}],{duration:1300+Math.random()*900,easing:'cubic-bezier(.15,.7,.4,1)'});
      a.onfinish=()=>g.remove();
    }
  }
  function snap(svg){
    if(busy)return;busy=true;
    svg.classList.add('clap');
    setTimeout(()=>{const b=svg.querySelector('.clapbar').getBoundingClientRect();glitter(b.left+b.width*.55,b.top+4,b.width*.8);},110);
    setTimeout(()=>svg.classList.remove('clap'),520);
    setTimeout(()=>{busy=false;},1300);
  }
  document.addEventListener('mouseover',e=>{const sv=e.target.closest&&e.target.closest('svg.slate');if(sv&&!(e.relatedTarget&&sv.contains(e.relatedTarget)))snap(sv);});
  document.addEventListener('click',e=>{const sv=e.target.closest&&e.target.closest('svg.slate');if(sv)snap(sv);});
})();
